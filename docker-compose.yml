# Stack Squishy Pop cho Portainer (Stacks → Add stack → Repository: repo SystemBase-BE).
# Biến môi trường đặt trong Portainer (xem .env.example). Truy cập web tại http://<server>:${WEB_PORT}
name: squishypop

services:
  # ===== SQL Server =====
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Chưa đặt MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Express}
      TZ: Asia/Ho_Chi_Minh
    # Cổng SQL Server trên server. Mặc định chỉ mở cho chính server (127.0.0.1) để kết nối qua đường hầm SSH:
    #   ssh -L 14330:127.0.0.1:1433 <user>@<server>   rồi dùng localhost,14330 trên máy bạn.
    # Muốn mở ra Internet: đặt MSSQL_BIND_IP=0.0.0.0 (nhớ chặn firewall chỉ cho IP của bạn).
    ports:
      - "${MSSQL_BIND_IP:-127.0.0.1}:${MSSQL_PUBLIC_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ===== Tạo database + bảng + dữ liệu người dùng (chạy xong thì tự thoát) =====
  db-init:
    build:
      context: ./docker/db
    image: squishypop-db-init:latest
    pull_policy: build
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-SquishyPop}
      DB_HOST: mssql
    restart: "no"

  # ===== Backend .NET =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: squishypop-backend:latest
    # Image tự build từ code, không có trên Docker Hub: không cho Portainer đi pull
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=${DB_NAME:-SquishyPop};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__Secret: ${JWT_SECRET:?Chưa đặt JWT_SECRET}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      # Chỉ cần khi trang đặt trước đặt ở tên miền khác với web chính
      Cors__AllowedOrigins__0: ${EXTRA_CORS_ORIGIN:-}
    volumes:
      - uploads:/app/wwwroot/uploads

  # ===== Frontend (nginx phục vụ web + chuyển /api, /hubs, /uploads sang backend) =====
  frontend:
    build:
      # Repo frontend riêng. Repo private: https://<github-user>:<token>@github.com/Trung2552003/Squishy-FE.git#main
      context: ${FE_GIT_CONTEXT:-https://github.com/Trung2552003/Squishy-FE.git#main}
      dockerfile: Dockerfile
    image: squishypop-frontend:latest
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mssql-data:
  uploads:
